services:
  - type: web
    name: chemlab-backend
    runtime: python
    repo: https://github.com/wiseman-s/ChemLab-Kenya
    plan: free
    region: oregon
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
    rootDir: backend
